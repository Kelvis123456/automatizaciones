name: validar flujos

on:
  pull_request:
    paths: ['flows/**', 'scripts/**']
  push:
    branches: [master]
    paths: ['flows/**', 'scripts/**']

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validar-flujos.mjs
